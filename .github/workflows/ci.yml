name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable:
    name: Portable source and backend tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Compile Python sources
        run: python -m compileall -q src/mettleq src/mlxq
      - name: Build distributable wheel and verify contents
        run: |
          python -m pip install --quiet build twine
          rm -rf dist
          python -m build
          python -m twine check dist/*
          python - <<'PY'
          import glob
          import zipfile

          wheels = glob.glob("dist/mettleq-*.whl")
          assert len(wheels) == 1, wheels
          with zipfile.ZipFile(wheels[0]) as archive:
              names = set(archive.namelist())
          assert "mettleq/__init__.py" in names
          assert any(name.endswith(".dist-info/METADATA") for name in names)
          assert any(name.endswith(".dist-info/entry_points.txt") for name in names)
          assert any(name.startswith("mettleq/shaders/") for name in names)
          assert any(name.startswith("mettleq/integrations/") for name in names)
          assert any("mettleq/datasets/qasm_local/" in name for name in names)
          print("verified", wheels[0], len(names), "files")
          PY
      - name: Install the sdist in a clean virtual environment
        run: |
          python -m venv /tmp/mettleq-sdist-${{ matrix.python-version }}
          /tmp/mettleq-sdist-${{ matrix.python-version }}/bin/python -m pip install --no-deps dist/mettleq-*.tar.gz
          /tmp/mettleq-sdist-${{ matrix.python-version }}/bin/python - <<'PY'
          import mettleq
          from mettleq.draw import circuit_ascii
          from mettleq.qasm import QASMParseError

          assert mettleq.__version__
          assert "q0" in circuit_ascii(1, [])
          assert QASMParseError
          print("sdist import verified", mettleq.__version__)
          PY
      - name: Require a clean checkout
        run: |
          status="$(git status --porcelain)"
          if [[ -n "$status" ]]; then
            echo "Build changed the tracked checkout:"
            echo "$status"
            git diff --stat
            exit 1
          fi

  portable-required:
    # Keep the exact protected-branch check name while the matrix above gives
    # us coverage on each supported Python version.
    name: Portable source and backend tests
    if: always()
    needs: portable
    runs-on: ubuntu-latest
    steps:
      - name: Require all portable matrix jobs to pass
        if: needs.portable.result != 'success'
        run: exit 1

  apple-metal:
    name: Apple Silicon simulator and Metal tests
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package with SDK and test extras
        run: python -m pip install -e '.[sdk,tests]'
      - name: Verify Apple GPU availability
        run: |
          python - <<'PY'
          import mlx.core as mx

          assert mx.metal.is_available(), "MLX Metal is unavailable"
          assert "gpu" in str(mx.default_device()).lower(), mx.default_device()
          print("MLX device:", mx.default_device())
          PY
      - name: Run simulator and SDK test suite
        run: python -m pytest src/tests -q
      - name: Run installed-SDK quickstarts
        run: |
          python examples/qiskit_quickstart.py
          python examples/pennylane_quickstart.py
      - name: Require a clean checkout
        run: |
          status="$(git status --porcelain)"
          if [[ -n "$status" ]]; then
            echo "Tests changed the tracked checkout:"
            echo "$status"
            git diff --stat
            exit 1
          fi
