name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable:
    name: Portable source and backend tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    env:
      METTLEQ_DISABLE_NATIVE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install build twine ruff
      - run: python -m compileall -q src/mettleq src/mlxq
      - run: python -m ruff check src/mettleq src/mlxq tools setup.py --select E9,F63,F7,F82
      - name: Build and check wheel and sdist
        run: |
          python -m build
          python -m twine check --strict dist/*
          python tools/check_distribution.py dist
      - name: Install and test the wheel
        run: |
          python -m venv "$RUNNER_TEMP/mettleq-wheel"
          "$RUNNER_TEMP/mettleq-wheel/bin/python" -m pip install dist/*.whl pytest
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/mettleq-wheel/bin/python" "$GITHUB_WORKSPACE/tools/smoke_installed.py"
          "$RUNNER_TEMP/mettleq-wheel/bin/python" -m pytest -c /dev/null "$GITHUB_WORKSPACE/src/tests/test_packaging.py" -o cache_dir="$RUNNER_TEMP/pytest-cache" -o addopts='-ra --strict-config --strict-markers'
      - name: Install and check the sdist
        run: |
          python -m venv "$RUNNER_TEMP/mettleq-sdist"
          "$RUNNER_TEMP/mettleq-sdist/bin/python" -m pip install dist/*.tar.gz
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/mettleq-sdist/bin/python" "$GITHUB_WORKSPACE/tools/smoke_installed.py"
      - name: Require a clean checkout
        run: test -z "$(git status --porcelain)"

  portable-required:
    name: Portable source and backend tests
    if: always()
    needs: portable
    runs-on: ubuntu-latest
    steps:
      - name: Require all portable matrix jobs to pass
        if: needs.portable.result != 'success'
        run: exit 1

  cross-platform-install:
    name: Clean install (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15]
        python-version: ["3.11", "3.12", "3.13"]
    env:
      MACOSX_DEPLOYMENT_TARGET: "14.0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Build and install from the source archive
        shell: bash
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check --strict dist/*
          python tools/check_distribution.py dist
          python - <<'PY'
          from pathlib import Path
          import subprocess, sys
          sdist, = Path("dist").glob("*.tar.gz")
          subprocess.check_call([sys.executable, "-m", "pip", "install", str(sdist)])
          PY
          cd "$RUNNER_TEMP"
          python "$GITHUB_WORKSPACE/tools/smoke_installed.py"

  apple-metal:
    name: Apple Silicon simulator and Metal tests
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/release-build.yml
