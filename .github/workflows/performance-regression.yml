name: Apple Silicon performance regression

on:
  workflow_dispatch:
    inputs:
      widths:
        description: Safe comma-separated crossover widths
        default: "16,18,20,22"
        required: true

permissions:
  contents: read

jobs:
  benchmark:
    # Public GitHub-hosted macOS labels are not guaranteed to be Apple Silicon
    # or thermally stable. Use an explicitly managed Apple-Silicon runner.
    runs-on: [self-hosted, macOS, ARM64, mettleq-benchmark]
    timeout-minutes: 120
    concurrency:
      group: mettleq-apple-silicon-performance
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e '.[dev,qiskit,pennylane]'
      - name: Capture privacy-safe environment
        run: python tools/capture_performance_environment.py --output performance/environment.json
      - name: Correctness and integration gate
        run: pytest -q src/tests/mlxQSdkPolicyTest.py src/tests/mlxQSdkIntegrationsTest.py src/tests/mlxQMetalKernelsTest.py
      - name: Matched Aer and Lightning crossover
        run: python tools/benchmark_sdk_crossover_large.py --widths '${{ inputs.widths }}' --output-dir performance/crossover
      - name: Radix occupancy proxy
        run: python tools/profile_metal_radix.py --qubits 22 --output performance/radix.json
      - name: Regression and accuracy gate
        run: >-
          python tools/check_performance_regression.py
          --baseline assets/benchmarks-frozen/fork-m3pro-20260718-sdk-crossover-radix16-idle/results.json
          --current performance/crossover/results.json
          --maximum-regression 0.15
      - uses: actions/upload-artifact@v7
        with:
          name: mettleq-performance-${{ github.sha }}
          path: performance/
          retention-days: 30
