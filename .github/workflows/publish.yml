name: Publish Python distribution

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  build:
    name: Build release artifacts (${{ matrix.os }})
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.12"
            artifact: linux-dist
          - os: macos-14
            python: "3.13"
            artifact: macos-arm64-dist
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install release tooling
        run: python -m pip install --upgrade build twine
      - name: Build artifacts
        run: |
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            python -m build --wheel
          else
            python -m build --sdist
          fi
      - name: Validate metadata
        run: python -m twine check dist/*
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*

  publish:
    name: Publish release artifacts
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Collect artifacts
        run: |
          mkdir dist
          find artifacts -type f -exec cp {} dist/ \;
          python - <<'PY'
          from pathlib import Path
          files = sorted(Path("dist").iterdir())
          if not files:
              raise SystemExit("No release artifacts were downloaded")
          print("\n".join(str(path) for path in files))
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install release tooling
        run: python -m pip install --upgrade twine
      - name: Validate metadata
        run: python -m twine check dist/*
      - name: Publish with PyPI trusted publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
