name: Publish to pypi

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  validate:
    uses: ./.github/workflows/release-build.yml

  publish:
    name: Publish validated artifacts
    needs: validate
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - name: Require the complete release set
        run: |
          python - <<'PY'
          from pathlib import Path
          files = list(Path("dist").iterdir())
          assert len(list(Path("dist").glob("*.tar.gz"))) == 1, files
          wheels = list(Path("dist").glob("*.whl"))
          assert len(wheels) == 3, wheels
          for tag in ("cp311", "cp312", "cp313"):
              assert any(f"-{tag}-{tag}-macosx_14_0_arm64.whl" in p.name for p in wheels), wheels
          PY
          python -m pip install twine
          python -m twine check --strict dist/*
      - name: Publish with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
