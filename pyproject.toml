[build-system]
requires = ["setuptools>=77", "numpy>=1.24"]
build-backend = "setuptools.build_meta"

[project]
name = "mettleq"
version = "0.3.0rc1"
description = "Trustworthy Apple Silicon quantum simulation with MLX and Metal"
readme = {file = "PYPI_README.md", content-type = "text/markdown"}
license = "MIT"
license-files = [
  "LICENSE",
  "src/mettleq/datasets/LICENSE-APACHE-2.0.txt",
  "src/mettleq/_vendor/peaked_mpo/LICENSE-APACHE-2.0.txt",
]
authors = [
  {name = "Monit Sharma", email = "MonitSharma@users.noreply.github.com"},
]
keywords = [
  "quantum-computing",
  "quantum-simulation",
  "apple-silicon",
  "metal",
  "mlx",
  "qiskit",
  "pennylane",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: MacOS :: MacOS X",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
  "Topic :: Scientific/Engineering",
]
requires-python = ">=3.11"
dependencies = [
  "mlx>=0.6.0; sys_platform == 'darwin' and platform_machine == 'arm64'",
  "rich>=13.0.0",
  "numpy>=1.24.0",
  "scipy>=1.10.0",
]

[project.optional-dependencies]
mpo = [
  "qiskit>=2.0,<3",
  "qiskit-quimb>=0.0.10,<1",
  "quimb>=1.11.2,<2",
]
tensor-network = [
  "cotengra>=0.7.5,<1",
  "numba>=0.65,<0.67",
  "qiskit>=2.0,<3",
  "qiskit-quimb>=0.0.10,<1",
  "quimb>=1.11.2,<2",
]
plot = [
  "matplotlib>=3.7.0",
]
tui = [
  "textual>=0.80.0",
]
backend = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "pydantic>=2.8,<3",
  "psutil>=5.9.0",
  "httpx>=0.27.0",
]
tests = [
  "pennylane>=0.45,<0.47",
  "qiskit>=2.0,<3",
  "pytest>=8.0.0,<10.0.0",
  "pytest-cov>=5.0.0",
]
qiskit = [
  "qiskit>=2.0,<3",
  "qiskit-aer>=0.17,<0.19",
]
pennylane = [
  "pennylane>=0.45,<0.47",
  "pennylane-lightning>=0.45,<0.47",
]
sdk = [
  "pennylane>=0.45,<0.47",
  "pennylane-lightning>=0.45,<0.47",
  "qiskit>=2.0,<3",
  "qiskit-aer>=0.17,<0.19",
]
baselines = [
  "pennylane>=0.45,<0.47",
  "qiskit>=2.0,<3",
  "qiskit-aer>=0.17,<0.19",
  "psutil>=5.9.0",
]
tutorials = [
  "pennylane>=0.45,<0.47",
  "qiskit>=2.0,<3",
  "qiskit-aer>=0.17,<0.19",
  "matplotlib>=3.7.0",
  "nbclient>=0.10,<0.11",
  "nbformat>=5.10,<6",
  "ipykernel>=6.29,<8",
]
dev = [
  "build>=1.2,<2",
  "mypy>=1.13,<2",
  "ruff>=0.8,<1",
  "twine>=5.1,<7",
]

[project.scripts]
mettleq-mpo = "mettleq.midpoint_mpo:main"

[project.urls]
Homepage = "https://github.com/MonitSharma/MettleQ"
Documentation = "https://github.com/MonitSharma/MettleQ#readme"
Repository = "https://github.com/MonitSharma/MettleQ"
Issues = "https://github.com/MonitSharma/MettleQ/issues"

[project.entry-points."pennylane.plugins"]
mettleq = "mettleq.integrations.pennylane:MettleQDevice"
"mettleq.adaptive" = "mettleq.integrations.pennylane:AdaptivePennyLaneDevice"
"mettleq.compat" = "mettleq.integrations.pennylane:MettleQDevice"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["mettleq*", "mlxq*"]

[tool.setuptools.package-data]
"mettleq.integrations" = ["pennylane_capabilities.toml"]
"mettleq" = ["py.typed", "datasets/*.qasm", "datasets/*.md", "datasets/*.txt", "datasets/qasm_local/*.qasm"]
"mettleq._vendor.peaked_mpo" = ["*.md", "*.txt"]

[tool.pytest.ini_options]
testpaths = ["src/tests"]
pythonpath = ["src"]
addopts = "-q -ra"
python_files = ["*Test.py", "test_*.py"]
strict_markers = true

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["tutorials", "assets", "dist"]

[tool.mypy]
python_version = "3.11"
packages = ["mettleq"]
ignore_missing_imports = true
check_untyped_defs = true
