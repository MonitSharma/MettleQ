[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mettleq"
version = "0.2.0"
description = "Trustworthy Apple Silicon quantum simulation with MLX and Metal"
readme = {file = "PYPI_README.md", content-type = "text/markdown"}
license = {file = "LICENSE"}
authors = [
  {name = "Monit Sharma"},
]
keywords = [
  "quantum-computing",
  "quantum-simulation",
  "apple-silicon",
  "metal",
  "mlx",
  "qiskit",
  "pennylane",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS :: MacOS X",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
]
requires-python = ">=3.11"
dependencies = [
  "mlx>=0.6.0",
  "rich>=13.0.0",
  "numpy>=1.24.0",
  "scipy>=1.10.0",
]

[project.optional-dependencies]
tensor-network = [
  "cotengra==0.7.5",
  "numba>=0.65,<0.67",
  "qiskit>=2.0,<3",
  "qiskit-quimb==0.0.10",
  "quimb==1.14.0",
]
plot = [
  "matplotlib>=3.7.0",
]
tui = [
  "textual>=0.80.0",
]
backend = [
  "fastapi==0.115.6",
  "uvicorn==0.30.6",
  "pydantic==2.8.2",
  "psutil>=5.9.0",
  "httpx>=0.27.0",
]
tests = [
  "pennylane>=0.45,<0.46",
  "qiskit>=2.0,<3",
  "pytest>=8.0.0,<10.0.0",
  "pytest-cov>=5.0.0",
]
qiskit = [
  "qiskit>=2.0,<3",
  "qiskit-aer>=0.17,<0.18",
]
pennylane = [
  "pennylane>=0.45,<0.46",
  "pennylane-lightning>=0.45,<0.46",
]
sdk = [
  "pennylane>=0.45,<0.46",
  "pennylane-lightning>=0.45,<0.46",
  "qiskit>=2.0,<3",
  "qiskit-aer>=0.17,<0.18",
]
baselines = [
  "pennylane>=0.45,<0.46",
  "qiskit>=2.0,<3",
  "qiskit-aer>=0.17,<0.18",
  "psutil>=5.9.0",
]
tutorials = [
  "pennylane>=0.45,<0.46",
  "qiskit>=2.0,<3",
  "qiskit-aer>=0.17,<0.18",
  "matplotlib>=3.7.0",
  "nbclient>=0.10,<0.11",
  "nbformat>=5.10,<6",
  "ipykernel>=6.29,<8",
]

[project.scripts]
mettleq-mpo = "mettleq.midpoint_mpo:main"

[project.urls]
Homepage = "https://github.com/MonitSharma/MettleQ"
Documentation = "https://github.com/MonitSharma/MettleQ#readme"
Repository = "https://github.com/MonitSharma/MettleQ"
Issues = "https://github.com/MonitSharma/MettleQ/issues"

[project.entry-points."pennylane.plugins"]
mettleq = "mettleq.integrations.pennylane:MettleQDevice"
"mettleq.adaptive" = "mettleq.integrations.pennylane:AdaptivePennyLaneDevice"
qupertino = "mettleq.integrations.pennylane:MettleQDevice"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["mettleq*", "mlxq*"]

[tool.setuptools.package-data]
"mettleq.integrations" = ["pennylane_capabilities.toml"]
"mettleq" = ["datasets/*.qasm", "datasets/*.md", "datasets/*.txt", "datasets/qasm_local/*.qasm"]
"mettleq._vendor.peaked_mpo" = ["*.md", "*.txt"]
